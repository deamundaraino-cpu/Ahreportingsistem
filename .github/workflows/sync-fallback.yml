name: Sync fallback (cola)

# Red de seguridad para la cola `sync_jobs`.
#
# El ejecutor principal es `sync-worker/` en el VPS. Este workflow existe para
# dos situaciones:
#   1. Aún no se ha desplegado el VPS — así la sincronización ya funciona.
#   2. El VPS está caído — la cola se sigue drenando, más lento pero sin huecos.
#
# No duplica trabajo: `claim_sync_job` usa FOR UPDATE SKIP LOCKED, así que si el
# VPS está vivo simplemente no encuentra jobs libres y termina en segundos.
#
# Requiere el secret CRON_SECRET en el repositorio (ya configurado).

env:
  APP_URL: https://reportes.adshouse.cloud

# issues:write permite abrir una incidencia cuando el pipeline está caído.
permissions:
  contents: read
  issues: write

on:
  schedule:
    # Cada 30 min, desplazado a :07 y :37 a propósito: el planificador de GitHub
    # es best-effort y se congestiona en las horas en punto, donde los retrasos
    # (y los saltos de ejecución) son mucho más frecuentes.
    #
    # Vercel Hobby solo permite 2 crons; GitHub Actions no tiene ese límite y en
    # repos públicos los minutos son ilimitados y gratuitos.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      plan:
        description: 'Plan a encolar antes de drenar (vacío = solo drenar)'
        required: false
        type: choice
        options: ['', 'diario', 'intradia', 'cierre_mes']
        default: ''

jobs:
  drain-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Encolar plan (solo en disparo manual)
        if: github.event_name == 'workflow_dispatch' && inputs.plan != ''
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ env.APP_URL }}/api/worker/enqueue?plan=${{ inputs.plan }}" \
            -w '\nHTTP %{http_code}\n'

      - name: Drenar la cola
        run: |
          # Tres pasadas: cada invocación procesa ~40s de trabajo antes de que
          # Vercel corte la función, así que encadenarlas avanza más por ciclo.
          for i in 1 2 3; do
            echo "── Pasada $i ──"
            response=$(curl -sS -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ env.APP_URL }}/api/worker/run-jobs")

            status=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            echo "HTTP $status"
            echo "$body"

            if [ "$status" != "200" ]; then
              echo "❌ run-jobs devolvió $status"
              exit 1
            fi

            # Si no quedó nada por hacer, no gastamos las pasadas restantes.
            claimed=$(echo "$body" | jq -r '.claimed // 0')
            if [ "$claimed" = "0" ]; then
              echo "Cola vacía — nada más que procesar."
              break
            fi
          done

      - name: Refrescar tokens de Hotmart
        # Respaldo del scheduler del VPS. El endpoint existía desde hace meses y
        # la documentación afirmaba que corría, pero no estaba en NINGÚN
        # planificador: sin esto, el estado 'expired' nunca se escribe y el aviso
        # a los administradores por token caducado no se dispara jamás.
        #
        # `continue-on-error`: un fallo de Hotmart no debe tumbar el drenado de
        # la cola, que es la función principal de este workflow.
        continue-on-error: true
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ env.APP_URL }}/api/cron/refresh-hotmart-tokens")
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$response" | sed '$d'

      - name: Healthcheck del pipeline
        run: |
          # Verifica que el pipeline haya sincronizado con éxito recientemente.
          # Si está "stale", falla el job para que GitHub avise (email + issue).
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ env.APP_URL }}/api/worker/health")
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "❌ health devolvió $status"
            exit 1
          fi

          stale=$(echo "$body" | jq -r '.stale // false')
          if [ "$stale" = "true" ]; then
            echo "❌ Pipeline sin sincronizaciones OK recientes (stale)."
            exit 1
          fi
          echo "✓ Pipeline saludable."

      - name: Abrir issue si el pipeline falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Evita duplicar issues: solo abre una si no hay ya una abierta.
          existing=$(gh issue list --state open --search 'Sync pipeline caído in:title' --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "Sync pipeline caído" \
              --body "El workflow de respaldo de sincronización falló (run ${{ github.run_id }}). Revisa el worker del VPS, la alineación de CRON_SECRET y el panel /admin/sync.\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || echo "No se pudo crear la issue (¿permisos?)."
          else
            echo "Ya existe una issue abierta para este problema."
          fi
