name: Budget Alert Check

on:
  schedule:
    - cron: '0 */4 * * *'   # Every 4 hours: 0h, 4h, 8h, 12h, 16h, 20h UTC
  workflow_dispatch:         # Allow manual trigger from GitHub UI

jobs:
  budget-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run budget check
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://reportes.adshouse.cloud/api/cron/budget-check)

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)

          echo "HTTP Status: $status"
          echo "Response: $body"

          if [ "$status" != "200" ]; then
            echo "❌ Budget check failed with status $status"
            exit 1
          fi

          alerts=$(echo "$body" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          results = data.get('results', [])
          sent = [r for r in results if r.get('alertSent')]
          checked = data.get('checked', 0)
          print(f'✅ Checked {checked} tabs')
          if sent:
              print(f'📧 Alerts sent:')
              for r in sent:
                  print(f\"  - {r['tab']}: {r['pct']}% → {r['alertSent']}\")
          else:
              print('No new alerts')
          " 2>/dev/null || echo "$body")

          echo "$alerts"
